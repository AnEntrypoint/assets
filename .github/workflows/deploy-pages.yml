name: Deploy to GitHub Pages

# Publishes the cluster-LOD asset corpus (streaming-cluster/*.cluster.glb) as a
# static site at https://anentrypoint.github.io/assets/. Serves:
#   - manifest.json      unified {Category:[{name,path,thumb}]} model index
#   - streaming-cluster/ the .cluster.glb bytes (EP_cluster_lod + EXT_meshopt_compression)
#   - thumbs/            256px PNG per model (LOD0 render via model-viewer)
# The streaming-gltf demo and the spoint editor both fetch manifest.json from
# here and stream the cluster GLBs cross-origin.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute cluster-GLB cache key
        id: glb-hash
        run: echo "hash=$(git ls-files 'streaming-cluster/*.cluster.glb' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore thumbnail cache
        id: thumb-cache
        uses: actions/cache@v4.2.3
        with:
          path: docs/thumbs
          key: thumbs-cluster-${{ steps.glb-hash.outputs.hash }}
          restore-keys: thumbs-cluster-

      - name: Install Playwright
        if: steps.thumb-cache.outputs.cache-hit != 'true'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate thumbnails (LOD0 of each cluster GLB)
        if: steps.thumb-cache.outputs.cache-hit != 'true'
        run: |
          git ls-files "streaming-cluster/*.cluster.glb" | while IFS= read -r glb; do
            out="docs/thumbs/${glb%.glb}.png"
            [ -f "$out" ] && continue
            mkdir -p "$(dirname "$out")"
            echo "Rendering $glb"
            node docs/render-glb.js "$glb" "$out" 256 256 || echo "WARN: failed $glb"
          done

      - name: Generate unified manifest into docs/
        run: node docs/gen-manifest.js docs/manifest.json

      - name: Copy cluster GLBs into docs/
        run: |
          mkdir -p docs/streaming-cluster
          cp streaming-cluster/*.cluster.glb docs/streaming-cluster/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
