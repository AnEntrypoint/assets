name: Deploy to GitHub Pages

# Publishes the cluster-LOD asset corpus (streaming-cluster/*.cluster.glb) as a
# static site at https://anentrypoint.github.io/assets/. Serves:
#   - manifest.json      unified {Category:[{name,path,thumb}]} model index
#   - streaming-cluster/ the .cluster.glb bytes (EP_cluster_lod + EXT_meshopt_compression)
#   - thumbs/            256px PNG per model (LOD0 render via model-viewer)
# The streaming-gltf demo and the spoint editor both fetch manifest.json from
# here and stream the cluster GLBs cross-origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- Publish-critical: manifest + GLB bytes first, so the deploy NEVER
      # waits on thumbnail rendering. These are fast (seconds).
      - name: Generate unified manifest into docs/
        run: node docs/gen-manifest.js docs/manifest.json

      - name: Copy cluster GLBs into docs/
        run: |
          mkdir -p docs/streaming-cluster
          cp streaming-cluster/*.cluster.glb docs/streaming-cluster/

      # --- Best-effort thumbnails: capped per run + cached across runs so they
      # backfill incrementally over successive pushes. A slow/failed render
      # (continue-on-error) never gates the deploy; the editor/demo tolerate
      # missing thumbs (labels + img.onerror). THUMB_BUDGET caps renders/run.
      - name: Restore thumbnail cache
        id: thumb-cache
        uses: actions/cache@v4.2.3
        with:
          path: docs/thumbs
          key: thumbs-cluster-${{ github.sha }}
          restore-keys: thumbs-cluster-

      - name: Install Playwright
        continue-on-error: true
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Generate thumbnails (best-effort, capped)
        continue-on-error: true
        timeout-minutes: 15
        env:
          THUMB_BUDGET: '400'
        run: |
          n=0
          git ls-files "streaming-cluster/*.cluster.glb" | while IFS= read -r glb; do
            out="docs/thumbs/${glb%.glb}.png"
            [ -f "$out" ] && continue
            [ "$n" -ge "$THUMB_BUDGET" ] && { echo "budget $THUMB_BUDGET reached; remaining backfill next run"; break; }
            mkdir -p "$(dirname "$out")"
            echo "Rendering $glb"
            node docs/render-glb.js "$glb" "$out" 256 256 || echo "WARN: failed $glb"
            n=$((n+1))
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
