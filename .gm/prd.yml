  witness: 'git diff .github/workflows/deploy-pages.yml shows ''npx playwright install --with-deps chromium'' changed to ''npx playwright install chromium'' at line 61 -- removes --with-deps which was triggering full apt-get update/install across ALL configured apt repos including the unrelated broken packages.microsoft.com/repos/azure-cli repo (stale/unsigned clearsign key), causing apt exit 100 and the entire browser download to abort with ''Failed to install browsers''. Root cause verified via gh run view 28899207374 --log showing the exact apt error followed by every subsequent render.mjs invocation failing with ''browserType.launch: Executable doesnt exist''. Plain ''playwright install chromium'' downloads only the browser binary (no system apt deps), which GitHub-hosted ubuntu-latest runners already carry the shared libs for under swiftshader/angle headless rendering (render-glb.js already passes --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader).'
  status: completed
