- key: mapspinner-terrain-occlusion-timing
  status: witnessed
  note: 'mapspinner has zero THREE.js dependency (raw WebGL2 gl context) so it cannot reuse OcclusionQueryTier''s THREE.Object3D-based box-render trick directly -- but it DOES share the same raw gl context/depth buffer as spoint (TerrainBackdrop.js explicit design), so a hand-rolled gl.beginQuery/endQuery box test is architecturally available without THREE. The real blocker is ORDERING: terrain (renderPlanet) draws FIRST each frame, before the scene (models/walls) that would occlude it, so this frame''s wall depth does not exist yet when terrain issues its query. A same-frame query is impossible; terrain must query against the PREVIOUS frame''s END-of-frame depth buffer content, meaning the occlusion query must be issued at the very START of frame N (before spoint''s terrain-then-scene draw sequence touches/clears anything), reading frame N-1''s final depth. This requires a new hook point in app.js''s render loop (before terrainBackdrop.renderPlanet, not after runOcclusionQueries) and confirming autoClear/clear semantics don''t wipe the previous frame''s depth before that query point.'
  witness: planet-orchestrator.js has no gl.beginQuery/endQuery/ANY_SAMPLES_PASSED_CONSERVATIVE anywhere; app.js's render loop clears/draws terrain first via renderPlanet before the scene; TerrainBackdrop.js:105-116 confirms shared depth via window.__planetDepthToCanvas
  id: mut-1783088640681
  witness_evidence: planet-orchestrator.js:opts.occlusionPredicate hook added in per-leaf loop before quad emit (verified via Read + node --check pass); TerrainOcclusion.js beginFrame/testAndReissue/endFrame implementation created and syntax-checked; TerrainBackdrop.js wires beginFrame before planet.frame() and endFrame after, threading occlusionPredicate into initMapspinnerPlanet opts; node scripts/check.mjs confirms 250 files parse cleanly including all three edited/new files
